<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choix de Portions</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 5vw;
    }

    h1 {
      font-size: 6vw;
      text-align: center;
    }

    .category {
      margin-bottom: 8vw;
      display: flex;
      flex-direction: column;
      gap: 1vw;
    }

    .category h2 {
      font-size: 5vw;
      display: flex;
      align-items: center;
      gap: 2vw;
      margin-bottom: 2vw;
    }

    .icon {
      font-size: 6vw;
    }

    .circle-container {
      display: flex;
      gap: 3vw;
      flex-wrap: wrap;
    }

    .circle {
      width: 15vw;
      height: 15vw;
      min-width: 50px;
      min-height: 50px;
      border: 2px solid #888;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      background: none;
    }

    .circle.half::before,
    .circle.full::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      border-radius: 50%;
      z-index: 1;
    }

    .circle.full::before {
      width: 100%;
    }

    .circle.half::before {
      width: 50%;
      border-top-left-radius: 50%;
      border-bottom-left-radius: 50%;
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }

    /* Couleurs par catégorie */
    .proteine.half::before,
    .proteine.full::before {
      background-color: #e74c3c;
    }

    .glucide.half::before,
    .glucide.full::before {
      background-color: #f5deb3;
    }

    .lipide.half::before,
    .lipide.full::before {
      background-color: #f1c40f;
    }

    .legume.half::before,
    .legume.full::before {
      background-color: #2ecc71;
    }

    .category-summary {
      font-size: 4vw;
      font-weight: bold;
      text-align: right;
      margin-top: 2vw;
    }

    button {
      padding: 3vw 6vw;
      font-size: 5vw;
      margin-top: 4vw;
      width: 100%;
      max-width: 400px;
      display: block;
      margin-left: auto;
      margin-right: auto;
      cursor: pointer;
    }
  </style>

  <script>
    function toggleCircleState(element) {
      if (element.classList.contains('full')) {
        element.classList.remove('full', 'half');
      } else if (element.classList.contains('half')) {
        element.classList.remove('half');
        element.classList.add('full');
      } else {
        element.classList.add('half');
      }
      saveState();
      afficherSelections();
    }

    function afficherSelections() {
      const categories = document.querySelectorAll('.category');
      categories.forEach(cat => {
        const circles = cat.querySelectorAll('.circle');
        let total = 0;
        circles.forEach(c => {
          if (c.classList.contains('half')) total += 0.5;
          if (c.classList.contains('full')) total += 1;
        });
        const summary = cat.querySelector('.category-summary');
        if (summary) summary.textContent = `${total} portions`;
      });
    }

    function saveState() {
      const circles = document.querySelectorAll('.circle');
      const states = Array.from(circles).map(c =>
        c.classList.contains('full') ? 'full' :
        c.classList.contains('half') ? 'half' : 'none'
      );
      localStorage.setItem('circleStates', JSON.stringify(states));
    }

    function loadState() {
      const states = JSON.parse(localStorage.getItem('circleStates') || '[]');
      const circles = document.querySelectorAll('.circle');
      circles.forEach((c, i) => {
        c.classList.remove('half', 'full');
        if (states[i] === 'half') c.classList.add('half');
        if (states[i] === 'full') c.classList.add('full');
      });
    }

    function resetCercles() {
      document.querySelectorAll('.circle').forEach(c => c.classList.remove('half', 'full'));
      localStorage.removeItem('circleStates');
      afficherSelections();
    }

    window.onload = () => {
      loadState();
      afficherSelections();
    };
  </script>
</head>
<body>

  <h1>Choisissez les portions</h1>

  <!-- Catégories -->
  <div class="category" id="proteines">
    <h2><span class="icon">🥩</span> Protéines</h2>
    <div class="circle-container">
      <div class="circle proteine" onclick="toggleCircleState(this)"></div>
      <div class="circle proteine" onclick="toggleCircleState(this)"></div>
      <div class="circle proteine" onclick="toggleCircleState(this)"></div>
      <div class="circle proteine" onclick="toggleCircleState(this)"></div>
    </div>
    <div class="category-summary">0 portions</div>
  </div>

  <div class="category" id="glucides">
    <h2><span class="icon">🍞</span> Glucides</h2>
    <div class="circle-container">
      <div class="circle glucide" onclick="toggleCircleState(this)"></div>
      <div class="circle glucide" onclick="toggleCircleState(this)"></div>
      <div class="circle glucide" onclick="toggleCircleState(this)"></div>
      <div class="circle glucide" onclick="toggleCircleState(this)"></div>
    </div>
    <div class="category-summary">0 portions</div>
  </div>

  <div class="category" id="lipides">
    <h2><span class="icon">🥜</span> Lipides</h2>
    <div class="circle-container">
      <div class="circle lipide" onclick="toggleCircleState(this)"></div>
      <div class="circle lipide" onclick="toggleCircleState(this)"></div>
      <div class="circle lipide" onclick="toggleCircleState(this)"></div>
      <div class="circle lipide" onclick="toggleCircleState(this)"></div>
    </div>
    <div class="category-summary">0 portions</div>
  </div>

  <div class="category" id="legumes">
    <h2><span class="icon">🥗</span> Légumes</h2>
    <div class="circle-container">
      <div class="circle legume" onclick="toggleCircleState(this)"></div>
      <div class="circle legume" onclick="toggleCircleState(this)"></div>
      <div class="circle legume" onclick="toggleCircleState(this)"></div>
      <div class="circle legume" onclick="toggleCircleState(this)"></div>
      <div class="circle legume" onclick="toggleCircleState(this)"></div>
      <div class="circle legume" onclick="toggleCircleState(this)"></div>
    </div>
    <div class="category-summary">0 portions</div>
  </div>

  <button onclick="resetCercles()">Réinitialiser</button>

</body>
</html>
